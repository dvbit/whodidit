<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: circle with HA-blue gradient -->
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#0288d1"/>
    </radialGradient>
  </defs>
  <circle cx="128" cy="128" r="120" fill="url(#bg)"/>

  <!-- Magnifying glass handle (drawn first so the ring covers its top end) -->
  <line x1="168" y1="168" x2="215" y2="215"
        stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
  <line x1="168" y1="168" x2="215" y2="215"
        stroke="#0d47a1" stroke-width="10" stroke-linecap="round"/>

  <!-- Magnifying glass ring -->
  <circle cx="112" cy="112" r="62" fill="#e3f2fd" stroke="#ffffff" stroke-width="10"/>
  <circle cx="112" cy="112" r="62" fill="none" stroke="#0d47a1" stroke-width="4"/>

  <!-- Question mark inside the lens -->
  <text x="112" y="145" text-anchor="middle"
        font-family="'Trebuchet MS', 'Verdana', sans-serif"
        font-size="98" font-weight="900" fill="#0d47a1">?</text>
</svg>
